baseURL = "https://rodopis.tomasmazac.cz/"
locale = "cs"
defaultContentLanguage = "cs"
title = "Rodopis"
# Keeps the .html URLs of the former VuePress site, so existing links and the
# relative ../file.pdf links in person pages keep working.
uglyURLs = true
# The output works without a web server (opened from disk) and under any
# path prefix: every link and asset is relative, nothing is fetched.
relativeURLs = true
enableGitInfo = true
disableKinds = ["rss"]

# Front matter keys are case-insensitive, so mtDna / yDna in a person page fill these.
[taxonomies]
  mtdna = "mtdna"
  ydna = "ydna"
[permalinks.taxonomy]
  ydna = "/y-dna/"
[permalinks.term]
  ydna = "/y-dna/:slug/"

# Netlify serves /page as page.html too; _redirects sends it to the one URL.
[mediaTypes."text/netlify"]
  delimiter = ""
[outputFormats.redirects]
  mediaType = "text/netlify"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true
[outputs]
  home = ["html", "redirects"]

[params]
  description = "Životní osudy našich předků"
  logo = "deciduous-tree_1f333.png"
  repo = "https://github.com/tomasmazac/rodopis"
  author = "Tomáš Mazač"
  email = "tomas.mazac+rodopis@gmail.com"

[markup.goldmark.renderer]
  # Person pages contain raw HTML (<div style>, <s>, &nbsp;).
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

[imaging.webp]
  # Scanned photos keep visible grain; the default 75 smears it.
  quality = 85

# Photos stay in static/images (originals are published and linked as they
# are) and are also mounted into assets so the photo shortcode can resize them.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static/images"
  target = "assets/images"

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime"]

[module.hugoVersion]
  extended = false
  min = "0.158.0"
