baseURL = "https://rodopis.tomasmazac.cz/"
locale = "cs"
defaultContentLanguage = "cs"
title = "Rodopis"
# Keeps the .html URLs of the former VuePress site, so existing links and the
# relative ../file.pdf links in person pages keep working.
uglyURLs = true
# The output works without a web server (opened from disk) and under any
# path prefix: every link and asset is relative, nothing is fetched.
relativeURLs = true
enableGitInfo = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Životní osudy našich předků"
  logo = "/deciduous-tree_1f333.png"
  repo = "https://github.com/tomasmazac/rodopis"
  author = "Tomáš Mazač"
  email = "tomas.mazac@gmail.com"

# Photos are rendered as dithered images; a click opens the original.
# Options: https://gohugo.io/functions/images/dither/
[params.dither]
  enabled = true
  # Dark tone matches the text colour (--text in assets/style.css).
  colors = ["2c3e50", "ffffff"]
  method = "Atkinson"
  strength = 1.0
  serpentine = true
  # Applied before dithering; old photos are too flat for a few colours.
  grayscale = true
  contrast = 25
  brightness = 15
  # Pixel width per photo size; the dither is computed at this width.
  widths = { sm = 165, md = 330, lg = 660 }


[markup.goldmark.renderer]
  # Person pages contain raw HTML (<div style>, <s>, &nbsp;).
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime"]

[module.hugoVersion]
  extended = false
  min = "0.158.0"

# Photos stay in static/images/ (linked directly, e.g. PDFs) and are also
# mounted into assets/ so the photo shortcode can resize and dither them.
[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "static/images"
  target = "assets/images"

[[module.mounts]]
  source = "assets"
  target = "assets"
