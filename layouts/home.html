{{ define "main" }}
<div class="hero">
  {{ partial "logo.html" . }}
  <h1>{{ site.Title }}</h1>
  <p class="description">{{ site.Params.description }}</p>
  <p><a class="action-button" href="{{ (site.GetPage "/osoby").RelPermalink }}">Rejstřík osob →</a></p>
</div>
<article class="content">
  {{ .Content }}
</article>
{{ partial "footer.html" . }}
{{ end }}
